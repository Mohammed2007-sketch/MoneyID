name: moneyid_app
description: MoneyID 🆔 - Ultra-lightweight, offline-first digital payment orchestrator for Palestine.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Offline SQLite / Hive local storage
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  # Lightweight AES Encryption
  encrypt: ^5.0.3
  # QR Code generation and scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  # Dialer and URL launcher for USSD (*370#, *110#, *267#) and Telegram bot
  url_launcher: ^6.2.5
  # System clipboard utilities
  flutter_services: null
  flutter_contacts: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Exact logo assets from official MoneyID website
  assets:
    - assets/logos/moneyid-logo.jpg
    - assets/logos/bank-of-palestine.jpg
    - assets/logos/islamic-bank.jpg
    - assets/logos/PalPay.jpg
    - assets/logos/JawwalPay.jpg
