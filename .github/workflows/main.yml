name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android Scaffold
        run: |
          flutter create --project-name moneyid_app . --platforms android

      - name: Upgrade AGP 8.2.1, Kotlin 1.9.24 & Gradle 8.2
        run: |
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
                  if (localPropertiesFile.exists()) {
                      localPropertiesFile.withReader("UTF-8") { reader ->
                          properties.load(reader)
                      }
                  }
                  def sdkPath = properties.getProperty("flutter.sdk")
                  assert sdkPath != null : "flutter.sdk not set in local.properties"
                  return sdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.2.1" apply false
              id "org.jetbrains.kotlin.android" version "1.9.24" apply false
          }

          include ":app"
          EOF

          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-all.zip
          EOF

      - name: Configure Official App Icon & Name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="MoneyID 🆔"/g' android/app/src/main/AndroidManifest.xml || true
          sed -i '/dev_dependencies:/a \  flutter_launcher_icons: ^0.13.1' pubspec.yaml
          cat << 'EOF' >> pubspec.yaml

          flutter_launcher_icons:
            android: "ic_launcher"
            ios: true
            image_path: "assets/logos/moneyid-logo.jpg"
            min_sdk_android: 21
          EOF

      - name: Install Dependencies & Generate Icons
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyID-APK
          path: build/app/outputs/flutter-apk/app-release.apk
