name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./moneyid-flutter-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Fix and Generate Android
        run: |
          sed -i 's/flutter_services: null//g' pubspec.yaml
          sed -i 's/🆔 //g' pubspec.yaml
          sed -i '/islamic-bank.jpg/d' pubspec.yaml
          flutter create --project-name moneyid_app . --platforms android
          sed -i 's/1.7.10/1.9.24/g' android/settings.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyID-APK
          path: moneyid-flutter-app/build/app/outputs/flutter-apk/app-release.apk
